  const THEME_KEY='vdvoem.theme';
  function applyTheme(theme,persist=true){const value=theme==='dark'?'dark':'light';document.documentElement.dataset.theme=value;if(persist)try{localStorage.setItem(THEME_KEY,value)}catch{}const button=document.getElementById('theme-toggle');if(button){const dark=value==='dark';button.innerHTML=icon(dark?'sun':'moon');button.setAttribute('aria-label',dark?'Включить светлую тему':'Включить тёмную тему');button.title=dark?'Светлая тема':'Тёмная тема'}document.querySelector('meta[name="theme-color"]').content=value==='dark'?'#181a18':'#f8f7f4'}

  function openCloudLogin(){cloudReady=false;openModal('Наш код пары',`<p class="modal-description">Введите общий код доступа. Он нужен только на новом устройстве.</p><form id="auth-form"><div class="form-grid" style="margin-top:17px"><label class="field full"><span>Код пары</span><input name="code" type="password" required maxlength="100" autocomplete="current-password" autofocus></label></div><div class="form-actions"><button class="btn primary" type="submit">Войти</button></div></form>`);document.getElementById('save-status').textContent='Нужен код пары'}
  async function pushCloudState(){if(cloudSyncing||!cloudReady)return;cloudSyncing=true;const savingSeq=cloudChangeSeq,savingState=structuredClone(state);try{const response=await fetch('/api/state',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({state:savingState,revision:cloudRevision})});const data=await response.json();if(response.status===409){state=validateState(data.state);cloudRevision=data.revision;render();notify('На другом устройстве появились новые изменения. Мы загрузили их — повторите свою последнюю правку.');return}if(response.status===401){openCloudLogin();return}if(!response.ok)throw Error(data.error||'Не удалось сохранить');const hadEmbeddedPhoto=savingState.wishes.some(w=>typeof w.photo==='string'&&w.photo.startsWith('data:'));cloudRevision=data.revision;if(savingSeq===cloudChangeSeq){state=validateState(data.state);document.getElementById('save-status').textContent='Синхронизировано';if(hadEmbeddedPhoto)render()}}catch(e){document.getElementById('save-status').textContent='Нет связи';notify('Не удалось синхронизировать. Изменения останутся на экране — попробуем снова.')}finally{cloudSyncing=false;if(cloudReady&&cloudChangeSeq>savingSeq){clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(pushCloudState,0)}}}
  async function pollCloudState(){if(!CLOUD_MODE||!cloudReady||cloudSyncing||document.hidden||document.getElementById('modal').open||document.activeElement?.matches('input,textarea,select'))return;try{const response=await fetch('/api/state',{cache:'no-store'});if(!response.ok)return;const data=await response.json();if(data.revision>cloudRevision){state=validateState(data.state);cloudRevision=data.revision;render();notify('Получены изменения с другого устройства')}}catch{}}
  async function submitCloudLogin(form){if(!form.reportValidity())return;const button=form.querySelector('button');button.disabled=true;try{const response=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:new FormData(form).get('code')})});const data=await response.json();if(!response.ok)throw Error(data.error||'Не удалось войти');closeModal();await fetchCloudState();notify('Теперь всё синхронизируется между вашими устройствами')}catch(e){notify(e.message);button.disabled=false}}
  async function logoutCloud(){await fetch('/api/auth',{method:'DELETE'});location.reload()}
  function showStorageWarning(){const node=document.getElementById('storage-warning');node.textContent=storageProblem;node.classList.toggle('hidden',!storageProblem)}
  function notify(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),3200)}
  function illustration(category){let body='';if(category==='Впечатления'){body='<ellipse cx="100" cy="113" rx="75" ry="13" fill="#bbc6b0" opacity=".5"/><path d="M21 103 65 45l45 58" fill="#bbc5ab"/><path d="m96 103 38-46 38 46" fill="#cbd4bc"/><path d="m39 63 43-26 43 26v50H39Z" fill="#d7a27e"/><path d="m29 67 53-35 53 35" fill="none" stroke="#816b55" stroke-width="6" stroke-linecap="round"/><path d="M76 112V80h21v32" fill="#8e7e60"/><rect x="48" y="72" width="19" height="20" rx="2" fill="#f4e7bf"/><path d="M145 106V69m-13 18 13-20 13 20m-24-8 11-19 11 19" stroke="#78846a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="148" cy="30" r="14" fill="#e4c592"/>'}else if(category==='Для дома'){body='<ellipse cx="100" cy="118" rx="63" ry="9" fill="#c6a48b" opacity=".2"/><rect x="48" y="27" width="83" height="89" rx="7" fill="#b88366"/><path d="M52 44h75v61H52Z" fill="#e6c7a9"/><rect x="67" y="49" width="45" height="12" rx="2" fill="#7d6453"/><path d="M82 60v11m15-11v11" stroke="#7d6453" stroke-width="5"/><path d="M74 79h31v16c0 17-31 17-31 0Z" fill="#fff7e9"/><path d="M105 82h6c12 0 10 14-6 14" stroke="#fff7e9" stroke-width="5" fill="none"/><rect x="43" y="110" width="93" height="7" rx="3" fill="#8d6e54"/><circle cx="118" cy="36" r="3" fill="#f3dfb8"/><path d="M150 109c-8-17 10-21 4-37m0 20c10-9 13-3 13-3" stroke="#949a70" fill="none" stroke-width="3"/><path d="M140 109h22l-3 11h-16Z" fill="#bfa285"/>'}else{body='<ellipse cx="100" cy="116" rx="64" ry="10" fill="#a5a0bd" opacity=".2"/><path d="M49 54h23l8-13h34l9 13h29v58H49Z" fill="#9c95af"/><rect x="43" y="60" width="112" height="48" rx="7" fill="#beb6c9"/><circle cx="99" cy="82" r="29" fill="#77758a"/><circle cx="99" cy="82" r="21" fill="#a5a9b1"/><circle cx="99" cy="82" r="14" fill="#626f79"/><circle cx="94" cy="76" r="5" fill="#c7d2d5"/><rect x="128" y="66" width="16" height="8" rx="2" fill="#e7decb"/><path d="m150 43 4-9m6 15 10-4" stroke="#b4a187" stroke-width="3" stroke-linecap="round"/>'}return `<svg class="illustration" viewBox="0 0 200 140" fill="none" aria-hidden="true">${body}</svg>`}
  function heroArt(){return `<svg class="hero-art" viewBox="0 0 370 245" fill="none" aria-hidden="true"><ellipse cx="210" cy="224" rx="143" ry="15" fill="#dcc9b5" opacity=".5"/><path d="M296 211V125m0 54c-34-4-41-30-34-45 30 3 40 21 34 45Zm0-29c29-3 40-29 32-43-26 5-34 19-32 43Z" fill="#9ca28a"/><path d="m275 201 43-2-9 32h-25Z" fill="#c3997f"/><rect x="91" y="90" width="165" height="131" rx="7" fill="#b89172" transform="rotate(-8 91 90)"/><rect x="85" y="82" width="165" height="131" rx="7" fill="#fcf7eb" transform="rotate(-8 85 82)"/><path d="m104 104 139-19" stroke="#e5d8bf" stroke-width="2"/><path d="m120 68 3 23m31-28 3 23m31-28 3 23m31-28 3 23" stroke="#8c8068" stroke-width="5" stroke-linecap="round"/><path d="m116 129 7 5 10-15m-13 35 7 5 10-15m-13 35 7 5 10-15" stroke="#acb292" stroke-width="3" stroke-linecap="round"/><path d="m147 126 68-9m-64 33 51-7m-48 31 62-9" stroke="#dfd3bf" stroke-width="3" stroke-linecap="round"/><path d="M225 41c-15-23-39-8-26 12l22 24 28-19c20-15 1-37-17-23Z" fill="#ce896d"/><path d="M233 127c-9-12-22-4-16 8l12 14 16-10c12-8 1-21-8-14Z" fill="#d8a087"/><ellipse cx="93" cy="216" rx="41" ry="12" fill="#c1a086"/><path d="M58 163h61v29c0 36-61 36-61 0Z" fill="#e1b28c"/><path d="M120 169h10c21 0 19 28-10 28" stroke="#d4a27b" stroke-width="9"/><ellipse cx="88" cy="163" rx="30" ry="8" fill="#f0d7b6"/><ellipse cx="88" cy="164" rx="23" ry="5" fill="#967c5f"/><path d="M81 147c-13-14 12-21 1-33m16 34c-12-11 8-18 1-27" stroke="#fff9ed" stroke-width="3" stroke-linecap="round"/><path d="m274 58 3-9 3 9 9 3-9 3-3 9-3-9-9-3Z" fill="#e0bd83"/><path d="m53 85 2-6 2 6 6 2-6 2-2 6-2-6-6-2Z" fill="#bdad89"/></svg>`}
  function empty(title,description,kind){return `<div class="empty">${icon(pageInfo[current]?.[1]||'heart')}<h3>${esc(title)}</h3><p>${esc(description)}</p>${kind?`<button class="btn soft" data-action="add" data-kind="${kind}">${icon('plus')}Добавить</button>`:''}</div>`}
  function heading(title,subtitle,kind,label){return `<div class="page-heading between"><div><h1>${title}</h1><p>${subtitle}</p></div>${kind?`<button class="btn primary" data-action="add" data-kind="${kind}">${icon('plus')}${label}</button>`:''}</div>`}
  function filterBar(options,searchPlaceholder){return `<div class="toolbar"><div class="filters">${options.map(([key,label])=>`<button class="filter ${filter===key?'active':''}" data-action="filter" data-value="${key}" aria-pressed="${filter===key}">${label}</button>`).join('')}</div><label class="search">${icon('search')}<input id="search" aria-label="${searchPlaceholder}" placeholder="${searchPlaceholder}" value="${esc(query)}"></label></div>`}
  const matches=item=>!query||[item.title,item.note,item.store,item.category,item.genre].filter(Boolean).join(' ').toLowerCase().includes(query.toLowerCase());
  function itemActions(kind,id){return `<div class="row-actions"><button class="icon-btn" data-action="edit" data-kind="${kind}" data-id="${esc(id)}" aria-label="Редактировать">${icon('edit')}</button><button class="icon-btn" data-action="delete" data-kind="${kind}" data-id="${esc(id)}" aria-label="Удалить">${icon('trash')}</button></div>`}
  function checkButton(kind,item){return `<button class="check" data-action="toggle" data-kind="${kind}" data-id="${esc(item.id)}" aria-label="${item.done?'Вернуть в список':'Отметить выполненным'}: ${esc(item.title)}" aria-pressed="${!!item.done}">${item.done?icon('check'):''}</button>`}
  function render(){document.title=`${pageInfo[current][0]} · Вдвоём`;document.getElementById('breadcrumb').textContent=pageInfo[current][0];renderNav();document.getElementById('avatars').innerHTML=state.names.map(n=>`<span class="avatar" title="${esc(n)}">${esc([...n][0]||'?')}</span>`).join('');document.getElementById('content').innerHTML=({home:renderHome,wishes:renderWishes,shopping:renderShopping,prices:renderPrices,tasks:renderTasks,movies:renderMovies})[current]()+`${hasExamples()?'<div class="demo-banner"><span>Для вдохновения добавили примеры. Названия и цены — демонстрационные.</span><button data-action="clear-examples">Удалить примеры</button></div>':''}<div class="bottom-note">${icon('heart')}Маленькие планы. Большое «мы».</div>`;showStorageWarning()}
  function renderNav(){document.getElementById('nav').innerHTML=Object.entries(pageInfo).map(([key,[title,i]])=>`<button data-action="nav" data-page="${key}" class="${current===key?'active':''}" ${current===key?'aria-current="page"':''}>${icon(i)}${title}${['wishes','shopping','tasks','movies'].includes(key)?`<span class="count">${state[key].filter(x=>!x.done).length}</span>`:''}</button>`).join('')}
  function renderHome(){const pending=state.tasks.filter(x=>!x.done);return heading('Хорошо, когда мы вместе','Все наши маленькие планы — в одном месте.')+`<section class="hero"><div class="hero-copy"><span class="eyebrow">Место, где начинается «мы»</span><h2>Мечтать. Планировать.<br>Просто быть <em>вдвоём.</em></h2><p>От списка продуктов до больших желаний.<br>Освободим время для самого важного — друг друга.</p><span class="hero-pill">${icon('heart')}Наше маленькое пространство</span></div>${heroArt()}</section><div class="stats">${[['wishes','heart','Общих желаний'],['shopping','bag','Нужно купить'],['tasks','checklist','В планах'],['movies','film','Хотим посмотреть']].map(([key,i,label])=>`<button class="stat" data-action="nav" data-page="${key}"><span class="stat-icon">${icon(i)}</span><div><div class="stat-number">${state[key].filter(x=>!x.done).length}</div><div class="stat-label">${label}</div></div></button>`).join('')}</div><div class="home-columns"><section class="panel"><div class="panel-head"><h2>Ближайшие планы</h2><button class="text-button" data-action="nav" data-page="tasks">Все дела ${icon('arrow')}</button></div><div class="panel-body">${pending.length?pending.slice().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,3).map(t=>`<div class="home-check">${checkButton('tasks',t)}<div class="grow"><div class="item-title">${esc(t.title)}</div><div class="subline">${esc(ownerLabel(t.owner))}${t.due?' · '+dateLabel(t.due):''}</div></div><span class="tag ${t.priority==='Высокий'?'peach':'green'} dot">${t.priority==='Высокий'?'Важно':'В планах'}</span></div>`).join(''):empty('Всё успели','Можно просто побыть вместе. Или придумать новый план.')}<button class="text-button" style="margin-top:10px" data-action="add" data-kind="tasks">${icon('plus')}Добавить маленький план</button></div></section><section class="panel"><div class="panel-head"><h2>На что мы заглядываемся</h2><button class="text-button" data-action="nav" data-page="wishes">Все хотелки ${icon('arrow')}</button></div><div class="panel-body"><div class="mini-wishes">${state.wishes.filter(x=>!x.done).slice(0,2).map(w=>`<article class="mini-wish"><div class="mini-art">${illustration(w.category)}</div><h3>${esc(w.title)}</h3><p>${w.budget!==''?money(w.budget):'Бесценно'}</p><span class="tag">${esc(ownerLabel(w.owner))}</span></article>`).join('')||empty('Начнём мечтать?','Запишите то, что однажды хотите осуществить.','wishes')}</div></div></section></div>`}
  function renderWishes(){const items=state.wishes.filter(matches).filter(x=>filter==='all'||(filter==='done'?x.done:filter==='pending'?!x.done:x.owner===filter));return heading('Наши хотелки','Мечты побольше и маленькие «хочу». Всё, что радует нас.','wishes','Добавить желание')+filterBar([['all','Все желания'],['me',esc(state.names[0])],['partner',esc(state.names[1])],['both','Общие'],['done','Исполнено']],'Найти желание')+`<div class="card-grid">${items.map(w=>`<article class="wish-card ${w.done?'done':''}"><div class="wish-art" style="background:${w.category==='Впечатления'?'#edf0e7':w.category==='Для дома'?'#f4e9dd':'#eeebf3'}"><span class="tag">${esc(w.category)}</span>${w.photo?`<img class="wish-photo" src="${esc(w.photo)}" alt="Фото желания: ${esc(w.title)}">`:illustration(w.category)}<div class="wish-actions">${itemActions('wishes',w.id)}</div></div><div class="wish-card-body"><h3 class="item-title">${esc(w.title)}</h3><p>${esc(w.note)||'Маленький повод порадовать друг друга.'}</p>${w.link?`<a class="text-button" href="${esc(w.link)}" target="_blank" rel="noopener noreferrer">${icon('link')}Посмотреть</a>`:''}<div class="wish-footer"><div><div class="wish-price">${w.budget!==''?money(w.budget):'Бесценно'}</div><div class="wish-owner">${esc(ownerLabel(w.owner))}</div></div><button class="complete-wish" data-action="toggle" data-kind="wishes" data-id="${esc(w.id)}">${icon(w.done?'check':'heart')}${w.done?'Исполнилось':'Исполнить'}</button></div></div></article>`).join('')||empty(query?'Ничего не нашлось':'Пока без желаний',query?'Попробуйте другое название или фильтр.':'Путешествие, подарок или завтрак в любимом месте?','wishes')}</div>`}
  function renderShopping(){const pending=state.shopping.filter(x=>!x.done),priced=pending.filter(x=>x.price!=='');const total=priced.reduce((s,x)=>s+Math.round(x.price*100*x.qty),0)/100;const items=state.shopping.filter(matches).filter(x=>filter==='all'||(filter==='done'?x.done:!x.done));return heading('Список покупок','Чтобы вернуться домой со всем нужным. И чем-нибудь вкусным.','shopping','Добавить покупку')+`<div class="summary-strip">${icon('bag')}<span>Осталось купить: <strong>${pending.length}</strong></span><span>По указанным ценам: <strong>${money(total)}</strong></span>${pending.length!==priced.length?`<span>Без цены: ${pending.length-priced.length}</span>`:''}<button class="text-button" style="margin-left:auto" data-action="nav" data-page="prices">Сравнить магазины ${icon('arrow')}</button></div>`+filterBar([['all','Все покупки'],['pending','Нужно купить'],['done','Куплено']],'Найти покупку')+`<div class="list-table">${items.map(x=>`<div class="list-row ${x.done?'done':''}">${checkButton('shopping',x)}<div class="grow"><div class="item-title">${esc(x.title)}</div><div class="subline">${esc(x.category)}${x.store?' · '+esc(x.store):''}</div></div><span class="row-meta">${x.qty} ${esc(x.unit)}</span><span class="row-price">${x.price!==''?money(Math.round(x.price*100*x.qty)/100):'—'}</span>${itemActions('shopping',x.id)}</div>`).join('')||empty('Список пока пуст',query?'Попробуйте изменить поиск.':'Добавьте покупки вручную или перенесите их из сравнения цен.','shopping')}</div>`}
  function renderTasks(){const items=state.tasks.filter(matches).filter(x=>filter==='all'||filter==='pending'&&!x.done||filter==='done'&&x.done||filter===x.owner);const renderRows=rows=>rows.map(t=>`<div class="list-row ${t.done?'done':''}">${checkButton('tasks',t)}<div class="grow"><div class="item-title">${esc(t.title)}</div>${t.note?`<div class="subline">${esc(t.note)}</div>`:''}</div><span class="tag ${t.priority==='Высокий'?'peach':t.priority==='Низкий'?'green':'purple'}">${esc(t.priority)}</span><span class="date-label ${!t.done&&t.due&&t.due<localDate()?'overdue':''}">${dateLabel(t.due)}</span><span class="owner-circle" title="${esc(ownerLabel(t.owner))}">${t.owner==='both'?icon('heart'):esc([...ownerLabel(t.owner)][0])}</span>${itemActions('tasks',t.id)}</div>`).join('');return heading('Наши дела','Делить заботы. Поддерживать друг друга. Успевать главное.','tasks','Добавить дело')+filterBar([['all','Все дела'],['pending','В планах'],['me',esc(state.names[0])],['partner',esc(state.names[1])],['done','Готово']],'Найти дело')+(items.length?`${items.some(x=>!x.done)?`<p class="task-group-heading">В планах · ${items.filter(x=>!x.done).length}</p><div class="list-table">${renderRows(items.filter(x=>!x.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')))}</div>`:''}${items.some(x=>x.done)?`<p class="task-group-heading">Уже сделано · ${items.filter(x=>x.done).length}</p><div class="list-table">${renderRows(items.filter(x=>x.done))}</div>`:''}`:empty('Можно выдохнуть',query?'По этому запросу дел не найдено.':'Здесь будут общие планы и личные задачи.','tasks'))}
  const moviePalettes=[['#52635e','#dfb878','#ffffff20'],['#846960','#dfbbae','#fff2ea22'],['#65617d','#c3b2cf','#f7edff24'],['#486478','#d6a86c','#e7f4ff20'],['#6d744f','#e3c67d','#f8ffe620'],['#765a70','#d9a9bc','#fff0f822']];
  function moviePalette(item){let hash=0;for(const char of `${item.genre}|${item.title}`)hash=(hash*31+char.codePointAt(0))>>>0;return moviePalettes[hash%moviePalettes.length]}
  function movieCover(item,label='СМОТРИМ ВМЕСТЕ'){const [bg,sun,ring]=moviePalette(item);return `<div class="movie-art" style="--movie-bg:${bg};--movie-sun:${sun};--movie-ring:${ring}"><span class="movie-mark">ВДВОЁМ · ${label}</span><span class="movie-poster-title">${esc(item.title)}</span></div>`}
  function renderMovieRatings(m){if(!m.done)return '';const rows=[[state.names[0],m.ratingMe],[state.names[1],m.ratingPartner]].filter(([,v])=>v!==''&&v!==undefined);if(!rows.length)return '<div class="movie-ratings"><span class="movie-rating">Оценок пока нет</span></div>';const avg=rows.reduce((sum,[,v])=>sum+Number(v),0)/rows.length;return `<div class="movie-ratings">${rows.map(([name,v])=>`<span class="movie-rating">${icon('star')}${esc(name)}: ${v}/10</span>`).join('')}<span class="movie-rating movie-average">Средняя: ${avg.toFixed(1)}/10</span></div>`}
  function renderMovies(){const genres=[...new Set(state.movies.map(x=>x.genre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'));const items=state.movies.filter(matches).filter(x=>(filter==='all'||filter==='done'&&x.done||filter==='pending'&&!x.done)&&(movieTypeFilter==='all'||x.contentType===movieTypeFilter)&&(movieGenreFilter==='all'||x.genre===movieGenreFilter));return heading('Смотрим вместе','Фильмы и сериалы для наших вечеров.','movies','Добавить')+`<div class="summary-strip" style="background:#eeebf3;color:#9683a7">${icon('film')}<span>В планах: <strong style="color:#867099">${state.movies.filter(x=>!x.done).length}</strong></span><span>Посмотрели: <strong style="color:#867099">${state.movies.filter(x=>x.done).length}</strong></span><button class="text-button" style="margin-left:auto;color:#927aa5" data-action="random-movie">${icon('shuffle')}Выбрать за нас</button></div><div class="movie-toolbar"><div class="movie-filter-block"><button class="filter ${movieTypeFilter==='all'?'active':''}" data-action="movie-type" data-value="all">Всё</button><button class="filter ${movieTypeFilter==='film'?'active':''}" data-action="movie-type" data-value="film">Фильмы</button><button class="filter ${movieTypeFilter==='series'?'active':''}" data-action="movie-type" data-value="series">Сериалы</button></div><div class="movie-filter-block"><button class="filter ${filter==='all'?'active':''}" data-action="filter" data-value="all">Все</button><button class="filter ${filter==='pending'?'active':''}" data-action="filter" data-value="pending">В планах</button><button class="filter ${filter==='done'?'active':''}" data-action="filter" data-value="done">Просмотрено</button></div><label><span class="sr-only">Жанр</span><select class="genre-select" id="movie-genre" aria-label="Фильтр по жанру"><option value="all">Все жанры</option>${genres.map(g=>`<option value="${esc(g)}" ${movieGenreFilter===g?'selected':''}>${esc(g)}</option>`).join('')}</select></label><label class="search">${   const UNIT_META={'шт.':{kind:'count',factor:1},'уп.':{kind:'pack',factor:1},'г':{kind:'weight',factor:1},'кг':{kind:'weight',factor:1000},'мл':{kind:'volume',factor:1},'л':{kind:'volume',factor:1000}};

  function normalizeOffer(product,value){if(typeof value==='number')value={price:value,size:1,unit:product.unit};if(!value||typeof value!=='object')return null;const price=Number(value.price),size=Number(value.size),unit=value.unit;if(!Number.isFinite(price)||price<0||!Number.isFinite(size)||size<=0||!UNIT_META[unit]||UNIT_META[unit].kind!==UNIT_META[product.unit]?.kind)return null;return {price,size,unit}}

  function calculatePlan(data=state){const groups=data.stores.map(store=>({store,items:[],totalCents:0})),missing=[];let totalCents=0;for(const p of data.products){let best=null;for(const group of groups){const normalized=normalizedPrice(p,p.prices[group.store.id]);if(!normalized)continue;if(!best||normalized.perBase<best.perBase)best={group,...normalized}}if(!best){missing.push(p);continue}const total=Math.round(best.perBase*p.qty*UNIT_META[p.unit].factor*100)/100,totalLineCents=Math.round(total*100);best.group.items.push({product:p,storeId:best.group.store.id,...best,total});best.group.totalCents+=totalLineCents;totalCents+=totalLineCents}return {groups:groups.filter(g=>g.items.length).map(g=>({...g,total:g.totalCents/100})),missing,total:totalCents/100}}

  function renderPriceResults(){const plan=calculatePlan();return `<div class="between"><div><h2>Ваш выгодный список</h2><p class="muted" style="font-size:11px;margin-top:4px">Расчёт по точному объёму или весу</p></div>${icon('spark')}</div>${plan.missing.length?`<div class="missing-notice">Нет цен: ${plan.missing.map(x=>esc(x.title)).join(', ')}. Эти продукты пока не включены в итог.</div>`:''}<div class="price-total"><div><span class="eyebrow" style="color:#909d80">${plan.missing.length?'Итого по известным ценам':'Минимальная стоимость корзины'}</span><div style="margin-top:5px"><strong>${money(plan.total)}</strong></div><p>${plan.groups.length?'Магазинов в списке: '+plan.groups.length+'. ':''}Фактический чек может отличаться, если товар продаётся только целыми упаковками.</p></div><button class="btn primary" data-action="transfer" ${plan.groups.length?'':'disabled'}>${icon('bag')}Перенести в покупки</button></div><div class="store-grid">${plan.groups.map(g=>`<section class="store-card"><div class="flex" style="margin-bottom:10px"><span class="store-icon">${icon('store')}</span><div class="grow"><h3>${esc(g.store.name)}</h3><span class="tiny muted">Позиций: ${g.items.length}</span></div><strong>${money(g.total)}</strong></div>${g.items.map(({product:p,offer,unitPrice,total})=>`<div class="store-product"><div>${esc(p.title)}<span>Нужно ${p.qty} ${esc(p.unit)} · ${offer.size} ${esc(offer.unit)} за ${money(offer.price)}</span><span>${money(unitPrice)} за 1 ${esc(p.unit)}</span></div><strong>${money(total)}</strong></div>`).join('')}</section>`).join('')}</div>`}

  function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`vdvoem-${localDate()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Резервная копия готова к скачиванию')}
  function safeUrl(value){try{return ['http:','https:'].includes(new URL(value).protocol)}catch{return false}}
  function validateState(input){if(!input||input.version!==1||!Array.isArray(input.names)||input.names.length!==2)throw Error('Формат копии не поддерживается');const out=emptyState();const str=(v,max=160)=>{if(typeof v!=='string'||v.length>max)throw Error('Некорректный текст');return v};const num=(v,min=0,max=100000000,optional=false)=>{if(optional&&v==='')return '';if(typeof v!=='number'||!Number.isFinite(v)||v<min||v>max)throw Error('Некорректное число');return v};const choice=(v,options)=>{if(!options.includes(v))throw Error('Некорректное поле');return v};const date=v=>{str(v,10);if(v&&(!/^\d{4}-\d{2}-\d{2}$/.test(v)||new Date(v+'T12:00:00Z').toISOString().slice(0,10)!==v))throw Error('Некорректная дата');return v};out.names=input.names.map(n=>{const result=str(n,30).trim();if(!result)throw Error('Не указаны имена');return result});const ids=new Set();for(const kind of ['wishes','shopping','tasks','movies','stores','products']){if(!Array.isArray(input[kind])||input[kind].length>5000)throw Error('Некорректный список');out[kind]=input[kind].map(x=>{if(!x||typeof x!=='object')throw Error('Некорректная запись');const id=str(x.id,80);if(!/^[a-zA-Z0-9_-]+$/.test(id)||['__proto__','constructor','prototype'].includes(id)||ids.has(id))throw Error('Некорректный идентификатор');ids.add(id);const item={id,sample:x.sample===true};if(kind==='stores'){item.name=str(x.name,80);if(!item.name.trim())throw Error('Пустое название');return item}item.title=str(x.title);if(!item.title.trim())throw Error('Пустое название');if(kind!=='products'){if(typeof x.done!=='boolean')throw Error('Некорректный статус');item.done=x.done}if(['wishes','tasks'].includes(kind))item.note=str(x.note??'',1500);if(['wishes','tasks'].includes(kind))item.owner=choice(x.owner,['both','me','partner']);if(kind==='wishes'){item.category=choice(x.category,['Впечатления','Для дома','Вещи','Другое']);item.budget=num(x.budget,0,100000000,true);item.link=str(x.link,2000);if(item.link&&!safeUrl(item.link))throw Error('Недопустимая ссылка');item.photo=str(x.photo??'',650_000);if(item.photo&&!(/^data:image\/(?:jpeg|png|webp);base64,[a-zA-Z0-9+/=]+$/.test(item.photo)||/^\/api\/photo\/[a-zA-Z0-9_-]{1,80}$/.test(item.photo)))throw Error('Недопустимое фото')}if(kind==='shopping'||kind==='products'){item.qty=num(x.qty,.001,10000);item.unit=choice(x.unit,units);if(kind==='shopping'){item.price=num(x.price,0,100000000,true);item.store=str(x.store,80);item.category=choice(x.category,['Продукты','Для дома','Другое']);if(x.sourceProduct)item.sourceProduct=str(x.sourceProduct,80)}else{if(!x.prices||typeof x.prices!=='object'||Array.isArray(x.prices))throw Error('Некорректные цены');item.prices={};for(const store of input.stores)if(Object.hasOwn(x.prices,store.id)){const raw=x.prices[store.id],offer=typeof raw==='number'?{price:num(raw),size:1,unit:item.unit}:raw;if(!offer||typeof offer!=='object'||Array.isArray(offer))throw Error('Некорректная цена');const normalized={price:num(offer.price),size:num(offer.size,.001,100000),unit:choice(offer.unit,units)};if(UNIT_META[normalized.unit].kind!==UNIT_META[item.unit].kind)throw Error('Несовместимая единица');item.prices[store.id]=normalized}}}if(kind==='tasks'){item.due=date(x.due);item.priority=choice(x.priority,['Обычный','Высокий','Низкий'])}if(kind==='movies'){item.contentType=choice(x.contentType??'film',['film','series']);item.genre=str(x.genre??'',80);item.watchedDate=date(x.watchedDate??'');item.ratingMe=num(x.ratingMe??'',1,10,true);item.ratingPartner=num(x.ratingPartner??'',1,10,true);if(!item.done){item.ratingMe='';item.ratingPartner=''}}return item})}return out}
  async function importData(file){if(!file)return;if(file.size>5000000){notify('Файл слишком большой. Допускается до 5 МБ.');return}try{const imported=validateState(JSON.parse(await file.text()));confirmAction('Загрузить резервную копию?','Текущие списки будут заменены данными из файла. Если они нужны, сначала отмените действие и скачайте текущую копию.',()=>{state=imported;preserveCorrupt=false;save();filter='all';query='';render();if(current==='prices')updatePriceUI();notify('Резервная копия загружена')},'Заменить данные')}catch(e){notify('Не удалось загрузить: выберите корректную JSON-копию приложения «Вдвоём».')}}
  function clearExamples(){confirmAction('Удалить примеры?','Удалим только демонстрационные записи, которые вы не изменяли. Ваши записи останутся.',()=>{const referenced=new Set(state.products.filter(p=>!p.sample).flatMap(p=>Object.keys(p.prices)));for(const k of ['wishes','shopping','tasks','movies','products'])state[k]=state[k].filter(x=>!x.sample);state.stores=state.stores.filter(s=>!s.sample||referenced.has(s.id));for(const s of state.stores)s.sample=false;save();render();if(current==='prices')updatePriceUI();notify('Готово. Пространство для ваших планов.')})}
  function navigate(page){if(!pageInfo[page])return;current=page;filter='all';query='';if(page!=='movies'){movieTypeFilter='all';movieGenreFilter='all'}if(location.hash!=='#'+page)history.replaceState(null,'','#'+page);closeMenu();render();if(page==='prices')updatePriceUI();window.scrollTo(0,0)}
  function closeMenu(){document.getElementById('sidebar').classList.remove('open');document.getElementById('mobile-shade').classList.remove('open');document.getElementById('menu-button').setAttribute('aria-expanded','false')}
  document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button)return;const {action,kind,id}=button.dataset;switch(action){case 'nav':navigate(button.dataset.page);break;case 'filter':filter=button.dataset.value;render();break;case 'movie-type':movieTypeFilter=button.dataset.value;render();break;case 'remove-wish-photo':{const preview=document.getElementById('photo-preview');preview.querySelector('[name=removePhoto]').value='yes';preview.querySelector('img').remove();preview.querySelector('.grow').textContent='Фото будет удалено после сохранения.';button.remove();break}case 'add':editItem(kind);break;case 'edit':editItem(kind,id);break;case 'delete':deleteItem(kind,id);break;case 'toggle':toggleItem(kind,id);break;case 'close-modal':closeModal();break;case 'settings':openSettings();break;case 'theme':applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');break;case 'clear-examples':clearExamples();break;case 'transfer':transferPlan();break;case 'export':exportData();break;case 'logout-cloud':logoutCloud();break;case 'import':document.getElementById('backup-input').click();break;case 'random-movie':{const pending=state.movies.filter(x=>!x.done&&(movieTypeFilter==='all'||x.contentType===movieTypeFilter)&&(movieGenreFilter==='all'||x.genre===movieGenreFilter));if(!pending.length){notify('В выбранных фильтрах пока нечего смотреть.');break}const film=pending[Math.floor(Math.random()*pending.length)];openModal('Сегодня смотрим…',`${movieCover(film,'ВЫБОР СЛУЧАЯ')}<p class="modal-description" style="margin-top:16px">${film.contentType==='series'?'Сериал':'Фильм'} · ${esc(film.genre)}</p><div class="form-actions"><button class="btn secondary" data-action="random-movie">Ещё вариант</button><button class="btn primary" data-action="close-modal">Отличный план</button></div>`);break}}});
  document.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='auth-form')submitCloudLogin(event.target);if(event.target.id==='item-form')submitItem(event.target);if(event.target.id==='names-form'){const data=new FormData(event.target),names=[data.get('first').trim(),data.get('second').trim()];if(names.some(x=>!x)){notify('Введите оба имени.');return}state.names=names;save();closeModal();render();if(current==='prices')updatePriceUI();notify('Теперь это точно наше пространство')}});
  function updateOfferInput(el){const productId=el.dataset.priceProduct||el.dataset.offerSize||el.dataset.offerUnit,p=state.products.find(x=>x.id===productId);if(!p)return;if(el.dataset.priceProduct){if(el.value===''){delete p.prices[el.dataset.priceStore];render();updatePriceUI();return}const old=normalizeOffer(p,p.prices[el.dataset.priceStore]);p.prices[el.dataset.priceStore]={price:Math.round(Number(el.value)*100)/100,size:old?.size||1,unit:old?.unit||p.unit}}else{const offer=normalizeOffer(p,p.prices[el.dataset.priceStore]);if(!offer)return;if(el.dataset.offerSize)offer.size=Number(el.value);else offer.unit=el.value;p.prices[el.dataset.priceStore]=offer}p.sample=false;save();updatePriceUI()}
  document.addEventListener('input',event=>{const el=event.target;if(el.setCustomValidity)el.setCustomValidity('');if(el.id==='search'){const position=el.selectionStart;query=el.value;render();const next=document.getElementById('search');next.focus();next.setSelectionRange(position,position)}if(el.dataset.priceProduct||el.dataset.offerSize||el.dataset.qty){if(!el.validity.valid||el.dataset.qty&&el.value==='')return;const p=state.products.find(x=>x.id===(el.dataset.priceProduct||el.dataset.offerSize||el.dataset.qty));if(!p)return;if(el.dataset.qty){p.qty=Number(el.value);p.sample=false;save();updatePriceUI()}else updateOfferInput(el)}});
  document.addEventListener('change',event=>{const el=event.target;if(el.id==='backup-input')importData(el.files[0]);if(el.id==='movie-genre'){movieGenreFilter=el.value;render()}if(el.dataset.offerUnit)updateOfferInput(el);if(el.dataset.priceProduct||el.dataset.offerSize||el.dataset.qty){if(!el.validity.valid||el.dataset.qty&&el.value===''){el.reportValidity();render();updatePriceUI();notify('Введите корректное число: количество и размер больше нуля, цена не меньше нуля.')}}});
  document.getElementById('menu-button').onclick=()=>{const open=document.getElementById('sidebar').classList.toggle('open');document.getElementById('mobile-shade').classList.toggle('open',open);document.getElementById('menu-button').setAttribute('aria-expanded',String(open))};
  document.getElementById('mobile-shade').onclick=closeMenu;
  window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));
  document.getElementById('brand-icon').innerHTML=icon('heart');document.getElementById('menu-button').innerHTML=icon('menu');document.getElementById('modal-close').innerHTML=icon('close');document.getElementById('together-note').innerHTML=icon('leaf')+'<p>Счастье — в простых вещах.<br>Особенно когда они общие.</p>';document.getElementById('settings-button').innerHTML=icon('settings')+'Имена и резервная копия';
  applyTheme(document.documentElement.dataset.theme||'light',false);render();if(current==='prices')updatePriceUI();if(CLOUD_MODE){fetchCloudState();setInterval(pollCloudState,4000);if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{})}
  </script>
