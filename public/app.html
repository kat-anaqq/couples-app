<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f8f7f4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Вдвоём" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <title>Вдвоём — наше маленькое пространство</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('vdvoem.theme') || 'light';
      } catch {}
    </script>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div id="mobile-shade" class="mobile-shade"></div>
    <aside class="sidebar" id="sidebar">
      <a
        class="brand"
        href="#home"
        style="text-decoration: none"
        aria-label="Вдвоём — главная"
        ><span class="brand-mark" id="brand-icon"></span
        ><span class="brand-name"
          >вдвоём<span style="color: #d68f73">.</span></span
        ></a
      >
      <p class="brand-caption">Маленький мир для двоих</p>
      <p class="nav-label">Наше пространство</p>
      <nav class="nav" id="nav" aria-label="Главная навигация"></nav>
      <div class="sidebar-bottom">
        <div class="together-note" id="together-note"></div>
        <button
          class="sidebar-settings"
          data-action="settings"
          id="settings-button"
        ></button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="flex">
          <button
            class="icon-btn mobile-menu"
            id="menu-button"
            aria-label="Открыть меню"
            aria-expanded="false"
          ></button
          ><span class="mobile-brand">вдвоём.</span>
          <div class="breadcrumb">
            Наше пространство
            <span style="padding: 0 12px; color: #c6c5bc">/</span>
            <span id="breadcrumb"></span>
          </div>
        </div>
        <div class="topbar-right">
          <span class="local-status" id="save-status">Сохранено в браузере</span
          ><button
            class="icon-btn theme-toggle"
            data-action="theme"
            id="theme-toggle"
            aria-label="Включить тёмную тему"
          ></button
          ><button
            class="avatars"
            data-action="settings"
            aria-label="Имена и настройки"
            id="avatars"
          ></button>
        </div>
      </header>
      <div
        id="storage-warning"
        class="storage-warning hidden"
        role="alert"
      ></div>
      <div class="content" id="content"></div>
    </main>
    <dialog id="modal" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button
          class="icon-btn"
          data-action="close-modal"
          aria-label="Закрыть"
          id="modal-close"
        ></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
